<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Cable-assisted AUV telemetry framework</title>
  <desc id="desc">A technical schematic showing acoustic-optical uplink through DAS and electric-magnetic downlink through a submarine optical-electric cable.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#9ed8f6"/>
      <stop offset="1" stop-color="#dff4ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#2f9fd1"/>
      <stop offset="0.55" stop-color="#0d6f9f"/>
      <stop offset="1" stop-color="#06435c"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1d78b5"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1f8a63"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#c77618"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0c3550" flood-opacity="0.18"/>
    </filter>
    <style>
      .label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#183142}
      .small{font-size:22px}
      .medium{font-size:28px;font-weight:700}
      .large{font-size:34px;font-weight:800}
      .tiny{font-size:18px}
      .box{fill:#ffffff;stroke:#b8d0dd;stroke-width:2;rx:18;filter:url(#shadow)}
      .pill{fill:#eef7fb;stroke:#9bc5d8;stroke-width:2;rx:22}
      .cable{fill:none;stroke:#111;stroke-width:11;stroke-linecap:round}
      .fiber{fill:none;stroke:#ffca3a;stroke-width:4;stroke-dasharray:10 12}
      .uplink{fill:none;stroke:#1d78b5;stroke-width:5;stroke-linecap:round;stroke-dasharray:9 9;marker-end:url(#arrow-blue)}
      .downlink{fill:none;stroke:#1f8a63;stroke-width:5;stroke-linecap:round;stroke-dasharray:12 10;marker-end:url(#arrow-green)}
      .optical{fill:none;stroke:#c77618;stroke-width:4;stroke-linecap:round;marker-end:url(#arrow-orange)}
    </style>
  </defs>

  <rect width="1280" height="720" fill="#eef7fb"/>
  <rect x="0" y="0" width="1280" height="250" fill="url(#sky)"/>
  <rect x="0" y="250" width="1280" height="470" fill="url(#sea)"/>
  <path d="M0 250 C150 236 300 268 470 250 C650 232 810 263 980 250 C1110 239 1190 246 1280 238" fill="none" stroke="#e8fbff" stroke-width="10" opacity="0.9"/>
  <path d="M0 250 C150 236 300 268 470 250 C650 232 810 263 980 250 C1110 239 1190 246 1280 238" fill="none" stroke="#70c1df" stroke-width="4" opacity="0.7"/>
  <rect x="0" y="590" width="1280" height="130" fill="#0b3546" opacity="0.55"/>

  <path d="M80 250 L80 590 L425 606 C590 614 730 560 890 570 C1030 580 1125 632 1220 610" class="cable"/>
  <path d="M80 250 L80 590 L425 606 C590 614 730 560 890 570 C1030 580 1125 632 1220 610" class="fiber"/>

  <rect x="28" y="84" width="170" height="110" class="box"/>
  <rect x="63" y="112" width="72" height="62" fill="#d7e5ec" stroke="#8baabd" stroke-width="2"/>
  <rect x="78" y="128" width="43" height="31" fill="#9fc6d8"/>
  <path d="M145 95 C175 78 205 82 230 104" fill="none" stroke="#2c82b8" stroke-width="5"/>
  <text x="113" y="216" text-anchor="middle" class="label medium">Shore station</text>

  <rect x="1012" y="572" width="180" height="86" class="box"/>
  <path d="M1045 626 L1160 626 L1146 590 L1060 590 Z" fill="#ffd85e" stroke="#b99024" stroke-width="3"/>
  <rect x="1072" y="602" width="55" height="18" fill="#b6dff0" stroke="#7faec4"/>
  <text x="1102" y="682" text-anchor="middle" class="label medium">Cable terminal</text>

  <g transform="translate(520 430)">
    <ellipse cx="0" cy="0" rx="112" ry="30" fill="#f8c94c" stroke="#9b7816" stroke-width="3"/>
    <rect x="-88" y="-22" width="160" height="44" rx="21" fill="#f7d654" stroke="#9b7816" stroke-width="3"/>
    <polygon points="72,-20 124,0 72,20" fill="#6a747c"/>
    <rect x="-42" y="-10" width="60" height="20" rx="7" fill="#376f8b"/>
    <line x1="-62" y1="-22" x2="-62" y2="-52" stroke="#c75238" stroke-width="8"/>
    <line x1="26" y1="-22" x2="26" y2="-50" stroke="#c75238" stroke-width="8"/>
    <text x="0" y="80" text-anchor="middle" class="label large" fill="#fff">AUV</text>
  </g>

  <rect x="296" y="80" width="280" height="86" class="pill"/>
  <text x="436" y="116" text-anchor="middle" class="label medium">Acoustic-optical uplink</text>
  <text x="436" y="148" text-anchor="middle" class="label tiny">AUV acoustic packet -> DAS optical return</text>

  <rect x="704" y="80" width="300" height="86" class="pill"/>
  <text x="854" y="116" text-anchor="middle" class="label medium">Electric-magnetic downlink</text>
  <text x="854" y="148" text-anchor="middle" class="label tiny">Cable current -> magnetic command</text>

  <path d="M488 400 C440 335 325 310 145 580" class="uplink"/>
  <text x="338" y="328" class="label small" fill="#eaf8ff">underwater acoustic signal</text>
  <path d="M152 560 C210 506 312 455 428 440" fill="none" stroke="#91d7f4" stroke-width="2" stroke-dasharray="5 9" opacity="0.8"/>
  <path d="M132 610 C345 635 742 565 1040 620" class="optical"/>
  <text x="640" y="540" text-anchor="middle" class="label small" fill="#eaf8ff">DAS reads distributed strain along the cable</text>

  <path d="M1110 590 C970 520 760 500 600 430" class="downlink"/>
  <text x="860" y="482" class="label small" fill="#eafff5">low-frequency magnetic field</text>
  <path d="M1010 540 C1015 500 1038 470 1076 454" fill="none" stroke="#7be0b5" stroke-width="4" stroke-dasharray="7 9"/>
  <path d="M987 522 C994 478 1026 438 1076 416" fill="none" stroke="#7be0b5" stroke-width="3" stroke-dasharray="7 9" opacity="0.7"/>

  <rect x="286" y="560" width="250" height="78" class="box"/>
  <text x="411" y="592" text-anchor="middle" class="label medium">Uplink data return</text>
  <text x="411" y="624" text-anchor="middle" class="label small">about 2628 bps in lake trial</text>

  <rect x="728" y="560" width="250" height="78" class="box"/>
  <text x="853" y="592" text-anchor="middle" class="label medium">Downlink commands</text>
  <text x="853" y="624" text-anchor="middle" class="label small">about 7.2 bps in sea trial</text>

  <text x="640" y="48" text-anchor="middle" class="label large">Receiverless underwater telemetry via submarine optical-electric cable</text>
</svg>
